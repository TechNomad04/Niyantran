version: '3.9'

services:

  db:
    image: postgres:14
    container_name: postgres_db
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "5432:5432"
    networks:
      - app-network

  redis:
    image: redis:7
    container_name: redis-cache
    restart: always
    ports:
      - "6379:6379"
    networks:
      - app-network

  eye-pipeline:
    build:
      context: ./eye-pipeline
    container_name: eye_pipeline
    restart: always
    ports:
      - "8001:8001"
    networks:
      - app-network

  backend:
    build:
      context: ./backend
    container_name: backend_app
    restart: always
    depends_on:
      - db
      - eye-pipeline
    env_file:
      - ./backend/.env
    environment:
      PIPELINE_URL: http://eye-pipeline:8001
    ports:
      - "8000:8000"
    networks:
      - app-network

networks:
  app-network:

volumes:
  pgdata:
  cache:
